name: Network-off honeypot CI

on:
  pull_request:
    paths:
      - ".github/workflows/network-off-honeypot.yml"
      - "modal_honeypot/**"
      - "tests/test_modal_honeypot.py"
      - "tests/test_network_off_suite.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/network-off-honeypot.yml"
      - "modal_honeypot/**"
      - "tests/test_modal_honeypot.py"
      - "tests/test_network_off_suite.py"
  workflow_dispatch:
    inputs:
      run_modal:
        description: "Run all 20 cases in a network-blocked Modal Sandbox"
        required: true
        default: false
        type: boolean
      publish_langfuse:
        description: "Score the Modal evidence through the Langfuse experiment gate"
        required: true
        default: false
        type: boolean
      langfuse_dataset:
        description: "Verified 20-item Langfuse dataset"
        required: true
        default: "gymsiege-network-off-v1"
        type: string
      langfuse_base_url:
        description: "Langfuse cloud region or self-hosted base URL"
        required: true
        default: "https://cloud.langfuse.com"
        type: string

permissions:
  contents: read

concurrency:
  group: network-off-honeypot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate corpus and runner contract
        run: |
          set -euo pipefail
          python3 -B modal_honeypot/network_off/validate_cases.py
          python3 -B -m unittest -v \
            tests.test_modal_honeypot \
            tests.test_network_off_suite
          python3 -B modal_honeypot/runner.py \
            --network-off-suite \
            --enable-network-off-suite \
            --all \
            --dry-run
      - name: Verify incomplete opt-in is rejected
        run: |
          if python3 -B modal_honeypot/runner.py \
            --network-off-suite --all --dry-run; then
            echo "network-off suite unexpectedly accepted an incomplete opt-in" >&2
            exit 1
          fi

  modal:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_modal || inputs.publish_langfuse) }}
    needs: contract
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Modal SDK
        run: python3 -m pip install --disable-pip-version-check modal==1.5.5
      - name: Run all network-off cases
        run: |
          set -euo pipefail
          python3 -B modal_honeypot/runner.py \
            --network-off-suite \
            --enable-network-off-suite \
            --all \
            --workers 4 \
            --output results/modal-network-off
      - name: Locate structured summary
        run: |
          set -euo pipefail
          run_dir="$(find results/modal-network-off -mindepth 1 -maxdepth 1 \
            -type d | sort | tail -n 1)"
          test -n "$run_dir"
          test -f "$run_dir/summary.json"
          printf 'NETWORK_OFF_SUMMARY=%s\n' "$run_dir/summary.json" >> "$GITHUB_ENV"
      - name: Run Langfuse containment gate
        if: ${{ inputs.publish_langfuse }}
        id: langfuse
        uses: langfuse/experiment-action@4000e456cc877788c01c8f3a5e95659bb59eadef # v1.0.8
        with:
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse_base_url: ${{ inputs.langfuse_base_url }}
          experiment_path: experiments/network_off_gate.py
          dataset_name: ${{ inputs.langfuse_dataset }}
          python_sdk_version: 4.15.1
          should_fail_on_regression: true
          should_fail_on_script_error: true
          should_comment_on_pr: false
          github_token: ${{ github.token }}
      - name: Store Langfuse result
        if: ${{ always() && inputs.publish_langfuse }}
        env:
          RESULT_JSON: ${{ steps.langfuse.outputs.result_json }}
        run: |
          mkdir -p results/langfuse
          printf '%s\n' "$RESULT_JSON" > results/langfuse/network-off-result.json
      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-off-honeypot-${{ github.run_id }}
          path: |
            results/modal-network-off/
            results/langfuse/
          if-no-files-found: error
          retention-days: 30
